################
### MONITORS ###
################

monitor = DP-2, 2560x1440@165.00, 2048x0, 1
monitor = HDMI-A-2, 2560x1440, 0x0, 1.25

# Start session on workspace 4 on DP-2
workspace = 4, monitor:DP-2, default:true

#############################
### PERSISTENT WORKSPACES ###
#############################

# HDMI-A-2 (Secondary monitor)
workspace = 1, persistent:true, monitor:HDMI-A-2
workspace = 2, persistent:true, monitor:HDMI-A-2
workspace = 3, persistent:true, monitor:HDMI-A-2

# DP-2 (Main monitor)
workspace = 4, persistent:true, monitor:DP-2
workspace = 5, persistent:true, monitor:DP-2
workspace = 6, persistent:true, monitor:DP-2
workspace = 7, persistent:true, monitor:DP-2

###########################
### NVIDIA DRIVERS & ENV ###
###########################

env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia

############################
### PC-SPECIFIC AUTOSTART ###
############################

exec-once = /home/vexa/shared/openrgb-all-off.sh
exec-once = discord
exec-once = hyprctl dispatch exec "[workspace 1 silent] Telegram"
exec-once = zen-browser
exec-once = obsidian
exec-once = yandexmusic
#exec-once = sleep 8 && hyprctl dispatch exec "[workspace 6 silent] /usr/bin/chromium --new-window --app=https://openweb.nexuszone.org"

##########################
### PC WORKSPACE RULES ###
##########################

windowrule = workspace 1 silent, match:class ^(discord)$
windowrule = workspace 4 silent, match:initial_class ^(zen)$
windowrule = workspace 6 silent, match:initial_class ^(TradingView)$
windowrule = workspace 7 silent, match:initial_class ^(obsidian)$
windowrule = workspace 7 silent, match:title ^(Spotify)$
windowrule = workspace 7 silent, match:initial_class ^(YandexMusic)$
windowrule = opacity 0.95 override 0.85 override, match:initial_title ^(openweb.nexuszone.org_/)$

# Game rules
#windowrulev2 = size 1920 1080, title:^Five Nights at Freddy's.*
#windowrulev2 = move 0 0, title:^Five Nights at Freddy's.*
#windowrulev2 = float, title:^Five Nights at Freddy's.*

##########################
### PC WINDOW RESIZING ###
##########################

bind = $mainMod, 6, resizeactive, -150 0
bind = $mainMod, 9, resizeactive, 150 0
bind = $mainMod, 8, resizeactive, 0 -100
bind = $mainMod, 7, resizeactive, 0 100

#############################
### PC WORKSPACE SWITCHING ###
#############################

# Switch workspaces using dedicated F-keys
bind = , F2, workspace, 1
bind = , F3, workspace, 2
bind = , F4, workspace, 3
bind = , F5, workspace, 4
bind = , F6, workspace, 5
bind = , F7, workspace, 6
bind = , F8, workspace, 7
bind = , F9, workspace, 8
bind = , F10, workspace, 9
bind = , F11, workspace, 10

# Move active window to workspace using SHIFT + F-keys
bind = SHIFT, F2, movetoworkspace, 1
bind = SHIFT, F3, movetoworkspace, 2
bind = SHIFT, F4, movetoworkspace, 3
bind = SHIFT, F5, movetoworkspace, 4
bind = SHIFT, F6, movetoworkspace, 5
bind = SHIFT, F7, movetoworkspace, 6
bind = SHIFT, F8, movetoworkspace, 7
bind = SHIFT, F9, movetoworkspace, 8
bind = SHIFT, F10, movetoworkspace, 9
bind = SHIFT, F11, movetoworkspace, 10

############################
### PC-SPECIFIC SCRIPTS  ###
############################

bind = , F12, exec, /home/vexa/shared/firefox-clean-ui.sh apply
bind = SHIFT, F12, exec, /home/vexa/shared/firefox-clean-ui.sh restore
bind = $mainMod, V, exec, /home/vexa/shared/vexa-dictate-toggle.sh
bind = $mainMod ALT, V, exec, /home/vexa/shared/vexa-whisper-stream.sh
