# Monitor idle only blanks displays. Locking happens before suspend.
general {
    lock_cmd = /usr/bin/pgrep -u "$(id -u)" -x hyprlock >/dev/null || /usr/bin/hyprlock --config "$HOME/.config/hypr/hyprlock.conf" --grace 0
    # Release the sleep inhibitor only after compositor-confirmed lock readiness.
    inhibit_sleep = 3
    # Keep lock-before-sleep protection; do not weaken inhibition for speed.
    before_sleep_cmd = /usr/bin/loginctl lock-session "$XDG_SESSION_ID"; python3 "$HOME/.config/hypr/compositor-ipc.py" dpms on
    # RGB is handled asynchronously by the system rgb-off.service.
    after_sleep_cmd = python3 "$HOME/.config/hypr/compositor-ipc.py" dpms on
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
}

# 1. Lock screen after 5 minutes of inactivity
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 2. Turn off display (DPMS) shortly after locking
listener {
    timeout = 400
    on-timeout = python3 "$HOME/.config/hypr/compositor-ipc.py" dpms off
    on-resume = python3 "$HOME/.config/hypr/compositor-ipc.py" dpms on
}

# 3. Suspend system after 30 minutes
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
