# Shared Hyprland configuration: PC and laptop

source = ~/.cache/wal/colors.conf

$mainMod = SUPER
$terminal = ghostty
$fileManager = yazi
$menu = rofi -show combi
$clipboard = cliphist list | rofi -dmenu -p "Clipboard" | cliphist decode | wl-copy

#################
### AUTOSTART ###
#################

exec-once = swaync
exec-once = hyprctl dispatch exec "[workspace 1 silent] Telegram"
exec-once = zen-browser
exec-once = obsidian
exec-once = yandexmusic

exec-once = playerctld daemon & waybar & awww-daemon
exec-once = hypridle
exec-once = systemctl --user start hyprsunset-controller.service

exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE
exec-once = systemctl --user start hyprland-session.target

###################
### ENVIRONMENT ###
###################

env = HYPRCURSOR_SIZE,30
env = HYPRCURSOR_THEME,BreezeX-Black-hyprcursor
env = GTK_CURSOR_THEME,BreezeX-Black-hyprcursor
env = XCURSOR_SIZE,30
env = XCURSOR_THEME,BreezeX-Black
env = QT_QPA_PLATFORMTHEME,qt6ct

# Preserved from your original configuration.
# Replace the GTK3 placeholder with your actual installed theme.
exec = gsettings set org.gnome.desktop.interface gtk-theme "YOUR_DARK_GTK3_THEME"
exec = gsettings set org.gnome.desktop.interface color-scheme "prefer-dark"

#####################
### LOOK AND FEEL ###
#####################

# Shared defaults; host.conf can override individual values.

general {
    no_focus_fallback = true
    gaps_in = 5
    gaps_out = 10
    border_size = 2

    col.active_border = $color9 $color13 45deg
    col.inactive_border = $background

    resize_on_border = false
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 4
    rounding_power = 3

    active_opacity = 0.85
    inactive_opacity = 0.8

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = true
        size = 1
        passes = 6
        vibrancy = 0.1696
        new_optimizations = true
        ignore_opacity = true
        special = true
        popups = true
    }
}

animations {
    enabled = true

    bezier = linear, 0, 0, 1, 1
    bezier = md3_standard, 0.2, 0, 0, 1
    bezier = md3_decel, 0.05, 0.7, 0.1, 1
    bezier = md3_accel, 0.3, 0, 0.8, 0.15
    bezier = overshot, 0.05, 0.9, 0.1, 1.1
    bezier = crazyshot, 0.1, 1.5, 0.76, 0.92
    bezier = hyprnostretch, 0.05, 0.9, 0.1, 1.0
    bezier = menu_decel, 0.1, 1, 0, 1
    bezier = menu_accel, 0.38, 0.04, 1, 0.07
    bezier = easeInOutCirc, 0.85, 0, 0.15, 1
    bezier = easeOutCirc, 0, 0.55, 0.45, 1
    bezier = easeOutExpo, 0.16, 1, 0.3, 1
    bezier = softAcDecel, 0.26, 0.26, 0.15, 1
    bezier = md2, 0.4, 0, 0.2, 1

    animation = windows, 1, 3, md3_decel, popin 60%
    animation = windowsIn, 1, 3, md3_decel, popin 60%
    animation = windowsOut, 1, 3, md3_accel, popin 60%
    animation = border, 1, 10, default
    animation = fade, 1, 3, md3_decel
    animation = layersIn, 1, 3, menu_decel, slide
    animation = layersOut, 1, 1.6, menu_accel
    animation = fadeLayersIn, 1, 2, menu_decel
    animation = fadeLayersOut, 1, 4.5, menu_accel
    animation = workspaces, 1, 7, menu_decel, slide
    animation = specialWorkspace, 1, 3, md3_decel, slidevert
}

dwindle {
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = -1
    disable_hyprland_logo = false
}

#############
### INPUT ###
#############

input {
    kb_layout = us, ru
    kb_variant =
    kb_model =
    kb_options = grp:caps_toggle
    kb_rules =

    follow_mouse = 1
    sensitivity = 0
    accel_profile = flat

    touchpad {
        natural_scroll = false
    }
}

# Preserved from your original config.
# Only applies if a device with this name exists.
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}

xwayland {
    force_zero_scaling = true
}

#####################
### HOST SETTINGS ###
#####################

# After shared appearance settings, so host overrides win.
# Before shared binds, so host program variables expand correctly.
source = ~/.config/hypr/host.conf

###################
### KEYBINDINGS ###
###################

bind = $mainMod, backspace, exec, $terminal
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, C, exec, $clipboard
bind = $mainMod, S, exec, hyprshot -m region --freeze
bind = $mainMod, N, exec, swaync-client -t -sw

# Waybar reload
bind = $mainMod, B, exec, killall waybar && waybar & disown || waybar & disown

# Wallpaper
bind = $mainMod, W, exec, ~/.config/scripts/changeWallpaper.sh

# Window controls
bind = $mainMod, Q, killactive
bind = $mainMod SHIFT, V, togglefloating
bind = $mainMod, F, fullscreen
bind = $mainMod, M, exit,

# Suspend on both hosts
bind = $mainMod, F10, exec, systemctl suspend

# Rofi
bind = $mainMod, SPACE, exec, $menu

# Focus: Vim keys
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

# Move windows
bind = $mainMod SHIFT, h, movewindow, l
bind = $mainMod SHIFT, l, movewindow, r
bind = $mainMod SHIFT, k, movewindow, u
bind = $mainMod SHIFT, j, movewindow, d

# Resize windows: Super+Ctrl+H/J/K/L
bind = $mainMod CTRL, h, resizeactive, -150 0
bind = $mainMod CTRL, l, resizeactive, 150 0
bind = $mainMod CTRL, k, resizeactive, 0 -100
bind = $mainMod CTRL, j, resizeactive, 0 100

# Scratchpad
bind = $mainMod, R, togglespecialworkspace, magic
bind = $mainMod SHIFT, R, movetoworkspace, special:magic

# Mouse window controls
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Audio/media keys
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

####################
### WINDOW RULES ###
####################

# Preserved rule syntax from your existing configuration.
windowrule = workspace 1 silent, match:class ^(discord)$
windowrule = workspace 4 silent, match:initial_class ^(zen)$
windowrule = workspace 6 silent, match:initial_class ^(TradingView)$
windowrule = workspace 7 silent, match:initial_class ^(obsidian)$
windowrule = workspace 7 silent, match:title ^(Spotify)$
windowrule = workspace 7 silent, match:initial_class ^(YandexMusic)$

windowrule = opacity 0.95 override 0.85 override, match:class ^(zen)$
windowrule = opacity 0.95 override 0.85 override, match:class ^(org.telegram.desktop)$

windowrule = no_focus on, match:class ^$, match:title ^$, match:xwayland 1, match:float 1, match:fullscreen 0, match:pin 0

windowrule = match:class ^(light_temp_slider\.py)$, size 300 50

# Rofi layer rules retained from your original config.
layerrule = match:namespace ^(rofi)$, blur on
layerrule = ignore_alpha 0, match:namespace ^(rofi)$
