# Minimal password-authenticated lock: no external assets or screenshot wait.
# An empty monitor selector applies to every output.
general {
    hide_cursor = true
    immediate_render = true
}

auth {
    pam {
        enabled = true
        module = hyprlock
    }
}

animations {
    enabled = false
}

background {
    monitor =
    color = rgba(111111ff)
}

input-field {
    monitor =
    size = 320, 60
    outline_thickness = 3
    outer_color = rgba(777777ff)
    inner_color = rgba(222222ff)
    font_color = rgba(ffffffff)
    placeholder_text = Enter password
    position = 0, 0
    halign = center
    valign = center
}
