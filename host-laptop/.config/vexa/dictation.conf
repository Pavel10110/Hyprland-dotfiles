# ThinkPad T430: observed four logical CPUs, Ivy Bridge CPU backend only.
# Do not point at /home/vexa; keep the shared default user-owned model path.
VEXA_WHISPER_THREADS=4
VEXA_WHISPER_BACKEND=cpu
VEXA_WHISPER_TIMEOUT=180
# The model must be provisioned with approval before dictation can work:
# ~/.local/share/vexa/models/ggml-small.bin
# No microphone override: use the desktop user's current PipeWire default source.

# vexa-eww-user-install: user-local Eww, no privileged package install
export PATH="$HOME/.local/bin:$PATH"
