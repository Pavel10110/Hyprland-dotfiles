# Laptop-specific configuration: ThinkPad T430
# Loaded by the shared hyprland.conf.

################
### PROGRAMS ###
################

$terminal = kitty
$fileManager = yazi

################
### MONITORS ###
################

# Use the connected display's preferred mode.
# No assumed LVDS-1/eDP-1 connector name.
monitor = , preferred, auto, 1

###################
### PERFORMANCE ###
###################

animations {
    enabled = false
}

decoration {
    rounding = 4

    # Only one shader can be active.
  #screen_shader = /usr/share/hyprshade/shaders/vibrance.glsl

    # To restore contrast instead, replace the line above with:
     screen_shader = ~/.config/hypr/contrast.glsl

    active_opacity = 0.975
    inactive_opacity = 0.9

    blur {
        enabled = false
    }

    shadow {
        enabled = false
    }
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    animate_manual_resizes = false
    animate_mouse_windowdragging = false
}

general {
    gaps_in = 3
    gaps_out = 5
    border_size = 1
    resize_on_border = false
}

##################
### WORKSPACES ###
##################

# Workspace 0 intentionally preserved.
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 0

# Move active window to workspace.
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 0

##################
### BRIGHTNESS ###
##################

bindel = , XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

############################
### MACHINE-LOCAL SCRIPT ###
############################

# Existing path retained; the script must exist and be executable.
#bind = $mainMod, V, exec, /home/vexa/shared/vexa-whisper-stream.sh
